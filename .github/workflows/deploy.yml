name: Deploy to Chrome Web Store

on:
  push:
    branches:
      - stable

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Zip extension
        run: |
          # Keep build/test/repository files out of the store upload. A Chrome
          # extension ZIP must contain manifest.json at its root.
          zip -q -r extension.zip \
            manifest.json \
            background.js \
            content.js \
            core.js \
            gamepad.js \
            virtual-keyboard.js \
            popup.html \
            popup.js \
            icons/*.png \
            sites/*.js

      - name: Validate extension package
        shell: bash
        run: |
          test -f manifest.json
          node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('manifest.json')); if (!m.version) throw new Error('manifest.json has no version'); console.log('Extension version:', m.version)"
          unzip -tq extension.zip
          unzip -l extension.zip

      - name: Upload to Chrome Web Store
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: extension.zip
          extension-id: ${{ secrets.CHROME_EXTENSION_ID }}
          client-id: ${{ secrets.CHROME_CLIENT_ID }}
          client-secret: ${{ secrets.CHROME_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CHROME_REFRESH_TOKEN }}
          publish: true
